# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "vp-agent"
description = "Local capture lifecycle for Vapour Profiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
libbpf-rs.workspace = true
libc.workspace = true
signal-hook.workspace = true
vp-bpf.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "process", "io-util"] }
serde_json = "1"
rand = "0.9"
chrono = "0.4"
tower-http = { version = "0.6", features = ["timeout", "limit"] }
tower = { version = "0.5", features = ["limit"] }
vp-analyze = { path = "../vp-analyze" }
