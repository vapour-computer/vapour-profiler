# SPDX-License-Identifier: MIT OR Apache-2.0
name: Rust and BPF
on: [push, pull_request]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang libelf-dev zlib1g-dev pkg-config
      - name: Install stable Rust checks
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --workspace
      - name: Build lifecycle fixture
        run: cc -O0 -g -Wall -Wextra -Werror -o target/probe-target tests/fixtures/probe-target.c
      - name: CLI is inert without an explicit capture
        run: target/debug/vapour-profiler --help
      # Real privileged kernel proof: tests/bpf_lifecycle.py on a BTF-enabled
      # Linux host. A successful compile is not claimed as lifecycle proof.
